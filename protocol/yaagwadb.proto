syntax = "proto3";

package yaagwadb;

option go_package = "yaagwadb/protocol";

service YaagwaDB {
  rpc Lookup(LookupRequest) returns (Attributes);
  rpc Getattr(GetattrRequest) returns (Attributes);
  rpc Setattr(SetattrRequest) returns (Attributes);
  rpc Readdir(ReaddirRequest) returns (stream DirectoryEntry);
  rpc Read(ReadRequest) returns (stream ReadResponse);
  rpc Write(stream WriteRequest) returns (WriteResponse);
  rpc Unlink(UnlinkRequest) returns (Empty);
  rpc Mkdir(MkdirRequest) returns (Attributes);
  rpc Rmdir(RmdirRequest) returns (Empty);
  rpc Rename(RenameRequest) returns (Empty);
  rpc Getxattr(GetxattrRequest) returns (GetxattrResponse);
  rpc Setxattr(SetxattrRequest) returns (Empty);
  rpc Listxattr(ListxattrRequest) returns (ListxattrResponse);
  rpc Removexattr(RemovexattrRequest) returns (Empty);
  rpc Statfs(Empty) returns (StatfsResponse);
  rpc Query(QueryRequest) returns (QueryResponse);

  rpc Status(Empty) returns (StatusResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
}

message Empty {}

message Attributes {
  uint64 inode = 1;
  uint64 parent_inode = 2;
  string name = 3;
  uint32 mode = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  uint64 size = 7;
  int64 access_time = 8; // UNIX nanoseconds
  int64 modify_time = 9;
  int64 change_time = 10;
  uint32 nlink = 11; // always 1 (2 for directories)
  uint32 rdev = 12;  // always 0
  uint64 blocks = 13;
  uint32 block_size = 14;
}

message LookupRequest {
  uint64 parent_inode = 1;
  string name = 2;
}

message GetattrRequest {
  uint64 inode = 1;
}

message SetattrRequest {
  uint64 inode = 1;
  optional uint32 mode = 2;
  optional uint32 uid = 3;
  optional uint32 gid = 4;
  optional uint64 size = 5; // only truncation to 0 is accepted
  optional int64 access_time = 6;
  optional int64 modify_time = 7;
}

message ReaddirRequest {
  uint64 inode = 1;
}

message DirectoryEntry {
  string name = 1;
  Attributes attributes = 2;
}

message ReadRequest {
  uint64 inode = 1;
  int64 offset = 2;
  int64 size = 3; // 0 means to the end
}

message ReadResponse {
  bytes data = 1;
}

message WriteTarget {
  uint64 parent_inode = 1;
  string name = 2;
  uint32 mode = 3;
  uint32 uid = 4;
  uint32 gid = 5;
}

message WriteRequest {
  oneof content {
    WriteTarget target = 1; // first message
    bytes data = 2;         // second and later messages
  }
}

message WriteResponse {
  string file_data_id = 1;
  uint64 size = 2;
  Attributes attributes = 3; // the written file as recorded in the index
}

message UnlinkRequest {
  uint64 parent_inode = 1;
  string name = 2;
}

message MkdirRequest {
  uint64 parent_inode = 1;
  string name = 2;
  uint32 mode = 3;
  uint32 uid = 4;
  uint32 gid = 5;
}

message RmdirRequest {
  uint64 parent_inode = 1;
  string name = 2;
}

message RenameRequest {
  uint64 old_parent_inode = 1;
  string old_name = 2;
  uint64 new_parent_inode = 3;
  string new_name = 4;
}

message GetxattrRequest {
  uint64 inode = 1;
  string name = 2;
}

message GetxattrResponse {
  bytes value = 1;
}

message SetxattrRequest {
  uint64 inode = 1;
  string name = 2;
  bytes value = 3;
}

message ListxattrRequest {
  uint64 inode = 1;
}

message ListxattrResponse {
  repeated string names = 1;
}

message RemovexattrRequest {
  uint64 inode = 1;
  string name = 2;
}

message StatfsResponse {
  uint64 block_size = 1;
  uint64 blocks = 2;
  uint64 blocks_free = 3;
  uint64 blocks_available = 4;
  uint64 files = 5;
  uint64 files_free = 6;
  uint32 name_length = 7;
}

message QueueStatus {
  string queue = 1;
  uint64 pending = 2;
  uint64 running = 3;
  uint64 failed = 4;
}

message StatusResponse {
  repeated QueueStatus queues = 1;
  uint64 file_data = 2;
  reserved 3; // removed failed-entry count
  uint64 logically_deleted = 4;
}

message ListTasksRequest {
  string queue = 1; // empty means all queues
  bool active_only = 2;
  uint32 limit = 3;
}

message Task {
  string queue = 1;
  uint64 id = 2;
  string kind = 3;
  string state = 4;
  uint32 attempts = 5;
  int64 next_run_at = 6;
  string last_error = 7;
  int64 created_at = 8;
  int64 finished_at = 9;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message QueryValue {
  oneof value { // none means NULL
    int64 integer = 1;
    double real = 2;
    string text = 3;
  }
}

message NamedQueryValue {
  string name = 1; // with its prefix, such as ":name"
  QueryValue value = 2;
}

message QueryRequest {
  string sql = 1;
  repeated QueryValue parameters = 2;
  repeated NamedQueryValue named_parameters = 3;
}

message QueryRow {
  repeated QueryValue values = 1;
}

message QueryResponse {
  repeated string columns = 1;
  repeated QueryRow rows = 2;
}
